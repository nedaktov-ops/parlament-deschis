        - generic [ref=f4e674]:
          - heading "Methodology" [level=2] [ref=f4e991]
          - paragraph [ref=f4e676]: "A group switch is counted once, in the chamber and legislature where it occurs, from the dated official group register: joining a new group is counted on the day the register records it, and leaving is counted on the day the register records the departure. The denominator is the number of members in the analysed scope (members holding a mandate in that chamber, in that legislature). We never fill gaps by assumption: if a source was not published or could not be read, the scope is marked as partial or unavailable and the figures are shown together with the coverage note."
          - link "Read the full methodology (docs/METHODOLOGY.md) ↗" [ref=f4e992] [cursor=pointer]:
            - /url: https://github.com/nedaktov-ops/parlament-deschis/blob/main/docs/METHODOLOGY.md
