name: Data

# Rebuild the corpus from the official sources and publish it.
#
# A release is published only after strict validation. The tracked marker is
# then pinned to that release and Render is triggered explicitly through its
# API: a push made with GITHUB_TOKEN does not start CI or Render's connected
# Git deployment. Scheduled runs are best-effort; workflow_dispatch remains
# the recovery path.
#
# W2.3 / issue #14 (cdep.ro ConnectTimeout on GitHub runners):
#
#   `--strict` is kept on BOTH the online build and the cached fallback. It is
#   the gate that refuses to ingest unless every chamber/legislature scope,
#   roster, group index and profile referenced by a ledger is present and the
#   three-view cross-check passes. We never remove it to turn a red run green.
#
#   What the cached fallback proves: the archived *official* cdep.ro fragments
#   are complete, parseable and internally consistent; every ingested row still
#   hashes back to an archived official page (manifest.jsonl), and the separate
#   `audit-corpus --strict --baseline` gate below must still pass. It does NOT
#   prove freshness — only a successful online revalidation does — and it does
#   NOT re-fetch the committee ledger (see the --skip-committees note on the
#   step). The chosen mode is recorded in the release body so a degraded run is
#   visible rather than silently presented as a fresh online build.
#
#   The official cdep page archive and third-party civic-source caches use
#   separate cache-key namespaces on purpose: a civic-source outage must never
#   block the official corpus, and a cdep outage must never evict civic caches.

on:
  schedule:
    # 03:17 UTC every day - an off-minute schedule avoids the crowd.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch every page instead of using the cache"
        type: boolean
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5 (annotated tag, dereferenced via ls-remote)
        with:
          enable-cache: true

      - run: uv sync --locked

      # Restore and save are deliberately split: actions/cache's automatic
      # post-save is skipped when a job fails, which is exactly when fresh
      # pages are most needed. Separate always() save steps below fix that.
      - name: Restore the official cdep page archive
        id: page-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/cache/cdep
          key: cdep-pages-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cdep-pages-

      # Deliberately NOT under the cdep-pages-* key. Wikidata/civic results are
      # licensed cross-checks, never a substitute for an official ledger; a
      # separate namespace means a civic-source outage cannot block the
      # official corpus rebuild, and a cdep outage cannot evict civic caches.
      - name: Restore the third-party source cache
        id: thirdparty-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/wikidata_cache.db
          key: thirdparty-sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            thirdparty-sources-

      # `--strict` is intentional on both attempts (see the header notes).
      # `if ...; then ... else ... fi` is used instead of `|| true` / a silent
      # skip: a failed online build is *observed*, and if the offline rebuild
      # fails too, the step exits with the original online status. Failure is
      # never converted into success by the fallback itself.
      - name: Collect and ingest (strict, with cached fallback)
        id: collect
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          build_corpus() {
            uv run python -m pipeline.cli --db data/parlament-real.db build-corpus \
              --chamber both --cache data/cache/cdep --strict \
              --current-cache-ttl-hours 24 --historical-cache-ttl-hours 720 "$@"
          }

          if [ -n "$FORCE" ]; then
            if build_corpus --force; then
              echo "mode=online" >> "$GITHUB_OUTPUT"
              exit 0
            else
              online_status=$?
            fi
          else
            if build_corpus; then
              echo "mode=online" >> "$GITHUB_OUTPUT"
              exit 0
            else
              online_status=$?
            fi
          fi

          echo "online cdep.ro build failed (exit $online_status); rebuilding strictly from the restored official page archive" >&2
          # --offline: use only cached official pages, never contact cdep.ro.
          # --skip-committees: the committee adapter has no disk cache and
          # always fetches live, so it cannot run during a cdep outage. This is
          # the CLI's documented escape hatch and keeps the fallback genuinely
          # offline; committee rows are refreshed by the next online run. The
          # release body records this mode so it is never presented as fresh.
          if build_corpus --offline --skip-committees; then
            echo "mode=offline" >> "$GITHUB_OUTPUT"
            exit 0
          else
            offline_status=$?
          fi

          echo "strict offline rebuild also failed (exit $offline_status)" >&2
          exit "$online_status"

      - name: Save the official cdep page archive (even on failure)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/cache/cdep
          key: cdep-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # Separate key namespace; skipped when no third-party cache was produced
      # so a fresh runner cannot fail the save step.
      - name: Save the third-party source cache (even on failure)
        if: always() && hashFiles('data/wikidata_cache.db') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/wikidata_cache.db
          key: thirdparty-sources-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Audit the corpus
        run: >-
          uv run python -m pipeline.cli --db data/parlament-real.db audit-corpus
          --strict --baseline data/reference/corpus-audit-baseline.json
          --json data/audit-report.json

      - name: Prepare the shippable database
        run: uv run python scripts/prepare_db.py data/parlament-real.db data/parlament.db

      - name: Choose immutable dataset release tag
        id: release
        run: |
          echo "tag=data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Publish the validated dataset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Dataset ${{ steps.release.outputs.tag }}
          body: |
            Validated dataset built from official sources by workflow run
            ${{ github.run_id }} (attempt ${{ github.run_attempt }}).

            Build mode: `${{ steps.collect.outputs.mode }}`. An `offline` mode means
            cdep.ro was unreachable and the corpus was rebuilt under the same
            `--strict` gate from the cached official page archive; freshness and
            the committee ledger are NOT proven for that run.

            * `parlament.db` - the SQLite database served by the API.
            * `manifest.jsonl` - every page fetched, with its URL and SHA-256.
            * `audit-report.json` - complete audit findings and check totals.
          files: |
            data/parlament.db
            data/cache/cdep/manifest.jsonl
            data/audit-report.json

      - name: Pin the release and trigger Render
        env:
          DATASET_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pinned=0
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            printf '%s\n' "$DATASET_RELEASE_TAG" > data/latest-release.txt
            git add data/latest-release.txt
            if git diff --cached --quiet; then
              echo "Release marker already points to $DATASET_RELEASE_TAG"
              pinned=1
              break
            fi
            git commit -m "Update dataset release marker to $DATASET_RELEASE_TAG"
            if git push origin main; then
              echo "Pinned $DATASET_RELEASE_TAG in commit $(git rev-parse HEAD)"
              pinned=1
              break
            fi
            echo "Push attempt $attempt failed; retrying against current main"
            sleep "$((attempt * 3))"
          done
          if [ "$pinned" != "1" ]; then
            echo "Failed to update the pinned dataset release marker" >&2
            exit 1
          fi

          # A push made with GITHUB_TOKEN starts neither CI nor Render's
          # connected Git deployment. Trigger Render explicitly through its
          # API using the credentials already used by the platform workflows.
          # Fail loudly if either is absent rather than silently not deploying.
          : "${RENDER_API_KEY:?RENDER_API_KEY secret is required to trigger deployment}"
          : "${RENDER_SERVICE_ID:?RENDER_SERVICE_ID variable is required to trigger deployment}"
          code=$(curl -sS -o /tmp/render-trigger.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache": false}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          echo "Render deploy trigger HTTP ${code}"
          if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
            jq -r '.message // .' /tmp/render-trigger.json || true
            echo "Failed to trigger Render deployment" >&2
            exit 1
          fi
          jq -r '"triggered deploy: id=\(.id // "-") status=\(.status // "-") commit=\(.commit.id // "-")"' \
            /tmp/render-trigger.json || true

      - name: Verify the deployed release
        env:
          DATASET_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RENDER_API_URL: https://parlament-deschis.onrender.com
        run: |
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            timeout=$((deadline - SECONDS))
            if (( timeout > 60 )); then timeout=60; fi
            if response="$(curl -fsS --connect-timeout 10 --max-time "$timeout" "$RENDER_API_URL/api/health")"; then
              if printf '%s' "$response" | jq -e --arg tag "$DATASET_RELEASE_TAG" \
                '.dataset.release_tag == $tag' >/dev/null; then
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then break; fi
                if (( remaining < timeout )); then timeout=$remaining; fi
                if curl -fsS --max-time "$timeout" "$RENDER_API_URL/api/traseism/overview" >/dev/null; then
                  echo "Render is serving dataset $DATASET_RELEASE_TAG"
                  exit 0
                fi
                echo "Render dataset route is not ready yet"
              fi
              echo "Render has not activated dataset $DATASET_RELEASE_TAG yet"
            else
              echo "Render health endpoint is not ready yet"
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then
              sleep "$((remaining < 30 ? remaining : 30))"
            fi
          done
          echo "Render did not confirm dataset $DATASET_RELEASE_TAG within 30 minutes" >&2
          exit 1

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "Automated dataset refresh/deployment failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            if (!issue) {
              core.info("No matching failure issue to close.");
              return;
            }
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "completed",
              body: `${issue.body || ""}\n- ${new Date().toISOString()}: resolved by successful run ${runUrl}.`,
            });
            core.info(`Closed failure issue #${issue.number}.`);

      - name: Report refresh or deployment failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DATASET_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const title = "Automated dataset refresh/deployment failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const releaseTag = process.env.DATASET_RELEASE_TAG || "not published";
            const note = `- ${new Date().toISOString()}: workflow run ${runUrl} failed; dataset release: ${releaseTag}.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                body: `${issue.body || ""}\n${note}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body: `${note}\n\nReview the workflow logs, failed validation gate, or Render deployment before rerunning.`,
              });
            }
