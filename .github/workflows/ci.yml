name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v5 (annotated-tag commit, dereferenced via ls-remote)
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Download latest published dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/download_dataset.py data/parlament.db

      - name: Lint
        run: uv run ruff check pipeline backend scripts tests

      - name: Test
        run: uv run pytest -q

      - name: i18n key diff
        run: node scripts/check_i18n_keys.mjs

      - name: Route/nav reachability guard
        run: node scripts/check_routes_nav.mjs

      - name: Frontend lint, type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v5 (annotated-tag commit, dereferenced via ls-remote)
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Download latest published dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/download_dataset.py data/parlament.db

      - name: Audit the published corpus
        run: >-
          uv run python -m pipeline.cli --db data/parlament.db audit-corpus
          --strict --baseline data/reference/corpus-audit-baseline.json

  docker:
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: parlament-deschis:ci
          # The Dockerfile uses a BuildKit secret for the GitHub releases API,
          # so the shared-runner 60 req/hour anonymous allowance cannot 403
          # the dataset download. No new secret values are introduced.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Prove the image serves the tool
        run: |
          docker run -d --name pd -p 8000:8000 parlament-deschis:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready >/dev/null; then break; fi
            sleep 2
          done
          EXPECTED_RELEASE="$(cat data/latest-release.txt)"
          curl -fsS http://127.0.0.1:8000/api/health \
            | jq -e --arg release "$EXPECTED_RELEASE" '.dataset.release_tag == $release'
          curl -fsS http://127.0.0.1:8000/api/traseism/overview | head -c 400
          docker logs pd

  evidence-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install frontend deps (LiveFeed guard requires typescript)
        run: npm ci
        working-directory: frontend

      - name: LiveFeed props guard
        run: node scripts/check_livefeed_props.mjs

      - name: Probe Playwright + Chromium availability
        id: playwright_probe
        run: |
          if python -c "import playwright" >/dev/null 2>&1 && [ -x /usr/bin/chromium ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: playwright chromium runtime not available on runner - scripts/ui_validate.py live check not run"
          fi

      - name: Report probe result
        run: |
          if [ "${{ steps.playwright_probe.outputs.available }}" = "true" ]; then
            echo "playwright+chromium AVAILABLE - scripts/ui_validate.py may be run locally/CI with a dev server"
          else
            echo "evidence: LiveFeed props guard PASSED; live UI validation SKIPPED on runner (no playwright/chromium) - not failing"
          fi

  # Deploy source of truth (owner decision #2 — see docs/remediation/STRATEGY.md §1):
  # This workflow intentionally contains NO manual deploy step. The former
  # "Trigger Vercel Deployment" and "Trigger Render Deploy" steps were removed:
  # they POSTed to the platform APIs with unchecked curls, a wrong git.uid, and
  # silent zero-code skips, so a "green deploy" proved nothing.
  #
  #   - Vercel: deploys happen via Vercel Git integration on push to main.
  #   - Render: deploys are gated by `autoDeployTrigger: checksPass` in render.yaml,
  #     so a green CI run is the gate; Render reacts, CI does not POST to it.
  #   - Proof: `.github/workflows/deploy-verify.yml` is the independent,
  #     post-deploy verification of the actually served release.
  #
  # The jobs above (test, audit, docker, evidence-guards) are unchanged and remain
  # the real quality gate that feeds those platform checks.